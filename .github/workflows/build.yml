name: Dragon Ball AF - Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar Dragon Ball AF
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Descomprimir proyecto
        shell: bash
        run: |
          mkdir -p source

          ZIP=$(find . -maxdepth 2 -type f \
            -name "Drag-n-Ball-AF_repo_listo.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No se encuentra el ZIP del proyecto."
            exit 1
          fi

          unzip -q "$ZIP" -d source

          echo "Contenido extraído:"
          find source -maxdepth 3 -type f | head -100

      - name: Localizar proyecto Gradle
        id: locate
        shell: bash
        run: |
          SETTINGS=$(find source -type f \
            -name settings.gradle \
            -not -path '*/.gradle/*' | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No se encuentra settings.gradle."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          if [ ! -f "$PROJECT_DIR/build.gradle" ]; then
            echo "ERROR: Falta build.gradle."
            exit 1
          fi

          echo "Proyecto encontrado: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Comprobar entorno
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          java -version
          gradle --version

      - name: Compilar mod Forge 1.20.1
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: gradle clean build --no-daemon --stacktrace

      - name: Publicar JAR
        uses: actions/upload-artifact@v4
        with:
          name: Dragon-Ball-AF-1.20.1
          path: ${{ steps.locate.outputs.project_dir }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14