name: Dragon Ball AF - Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar Dragon Ball AF
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Localizar proyecto Gradle
        id: locate
        shell: bash
        run: |
          SETTINGS=$(find . -maxdepth 6 -type f \
            -name settings.gradle \
            -not -path '*/.gradle/*' | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No se encuentra settings.gradle"
            find . -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          if [ ! -f "$PROJECT_DIR/build.gradle" ]; then
            echo "ERROR: No se encuentra build.gradle en $PROJECT_DIR"
            exit 1
          fi

          echo "Proyecto encontrado: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Preparar Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Comprobar archivos
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          java -version
          gradle --version
          ls -la

      - name: Compilar mod Forge
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: gradle clean build --no-daemon --stacktrace

      - name: Publicar JAR
        uses: actions/upload-artifact@v4
        with:
          name: Dragon-Ball-AF-Forge-1.20.1
          path: ${{ steps.locate.outputs.project_dir }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14