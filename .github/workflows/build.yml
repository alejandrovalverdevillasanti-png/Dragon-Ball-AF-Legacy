name: Dragon Ball AF - Legacy of the Saiyans

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Comprobar archivos
        run: |
          test -f build.gradle
          test -f settings.gradle
          test -d src/main/java

      - name: Compilar el mod
        run: gradle clean build --no-daemon --stacktrace

      - name: Guardar el JAR
        uses: actions/upload-artifact@v4
        with:
          name: Dragon-Ball-AF-Forge-1.20.1
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
