name: Dragon Ball AF - Legacy of the Saiyans

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Encontrar y preparar el proyecto
        run: |
          mkdir -p /tmp/dragonball

          if [ -f "build.gradle" ]; then
            PROJECT="$(pwd)"
          else
            ZIP=$(find . -maxdepth 4 -type f -iname "*.zip" | head -n 1)

            if [ -z "$ZIP" ]; then
              echo "ERROR: No se encontró build.gradle ni un ZIP."
              exit 1
            fi

            unzip -q "$ZIP" -d /tmp/dragonball

            GRADLE_FILE=$(find /tmp/dragonball -type f -name "build.gradle" | head -n 1)

            if [ -z "$GRADLE_FILE" ]; then
              echo "ERROR: El ZIP no contiene build.gradle."
              exit 1
            fi

            PROJECT=$(dirname "$GRADLE_FILE")
          fi

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Proyecto encontrado en: $PROJECT"

      - name: Comprobar archivos
        run: |
          test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/settings.gradle"
          test -d "$PROJECT_DIR/src/main/java"

      - name: Compilar el mod
        run: |
          cd "$PROJECT_DIR"
          gradle clean build --no-daemon --stacktrace

      - name: Guardar el JAR
        uses: actions/upload-artifact@v4
        with:
          name: Dragon-Ball-AF-Forge-1.20.1
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
